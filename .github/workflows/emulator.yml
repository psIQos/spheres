name: Emulator test

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write # publish_shots.py stores screenshots as git blobs

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26 # minSdk
            target: default
          - api-level: 35 # targetSdk
            target: google_apis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Play on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python .github/e2e/play.py app/build/outputs/apk/release/app-release.apk e2e-out

      - name: Publish screenshots
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/e2e/publish_shots.py e2e-out api-${{ matrix.api-level }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-api-${{ matrix.api-level }}
          path: e2e-out
