name: Emulator test

# Like Build APK: pull requests against main, main itself, or a manual run.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

# A new push to a pull request cancels its outdated run. Runs on main, tags and
# manual runs (releases) get a group of their own and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write # publish_shots.py stores screenshots as git blobs

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40 # a normal run takes 24-27 min; a hang should not burn an hour
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26 # minSdk
            target: default
          - api-level: 35 # targetSdk
            target: google_apis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      # The release build made debuggable, so the test can top up the dot account.
      - name: Build e2e APK
        run: ./gradlew --no-daemon assembleE2e

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator download sometimes arrives broken ("Error on ZipFile unknown archive"),
      # so install it here with retries; the runner action then finds it up to date.
      - name: Install emulator
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3; do
            if out=$("$sdkmanager" --install emulator --channel=0 2>&1) && ! grep -qi "error" <<< "$out"; then
              exit 0
            fi
            echo "emulator install attempt $i failed:"; tail -5 <<< "$out"
            sleep 15
          done
          exit 1

      - name: Play on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python .github/e2e/play.py app/build/outputs/apk/e2e/app-e2e.apk e2e-out

      - name: Publish screenshots
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/e2e/publish_shots.py e2e-out api-${{ matrix.api-level }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-api-${{ matrix.api-level }}
          path: e2e-out
