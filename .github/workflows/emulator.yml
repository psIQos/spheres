name: Emulator test

# Two suites:
# - smoke: API 35 only, a short play-through (install, menu, a few moves, no crash or
#   ANR). Runs for draft pull requests, so feature work gets quick feedback.
# - full: API 26 and 35, every check of play.py plus the monkey test. Runs for pull
#   requests that are ready for review (required before merging), on main, before a
#   tested release (called by Build APK) and manually.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      suite:
        description: "smoke (API 35, short) or full (API 26 and 35, all checks)"
        type: choice
        options: [full, smoke]
        default: full
  workflow_call:
    inputs:
      suite:
        type: string
        default: full

# A new push to a pull request cancels its outdated run. Runs on main, tags and
# manual runs (releases) get a group of their own and are never cancelled.
# (A literal prefix: called from Build APK, github.workflow names the caller.)
concurrency:
  group: emulator-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write # publish_shots.py stores screenshots as git blobs

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      suite: ${{ steps.plan.outputs.suite }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          SUITE: ${{ inputs.suite }}
        run: |
          if [ "$DRAFT" = "true" ] || [ "$SUITE" = "smoke" ]; then
            echo "suite=smoke" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[{"api-level":35,"target":"google_apis"}]}' >> "$GITHUB_OUTPUT"
          else
            echo "suite=full" >> "$GITHUB_OUTPUT"
            # minSdk and targetSdk
            echo 'matrix={"include":[{"api-level":26,"target":"default"},{"api-level":35,"target":"google_apis"}]}' >> "$GITHUB_OUTPUT"
          fi

  emulator:
    needs: plan
    name: emulator ${{ needs.plan.outputs.suite }} (${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 40 # a full run takes 20-27 min; a hang should not burn an hour
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      # The release build made debuggable, so the test can top up the dot account.
      - name: Build e2e APK
        run: ./gradlew --no-daemon assembleE2e

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator download sometimes arrives broken ("Error on ZipFile unknown archive"),
      # so install it here with retries; the runner action then finds it up to date.
      - name: Install emulator
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3; do
            if out=$("$sdkmanager" --install emulator --channel=0 2>&1) && ! grep -qi "error" <<< "$out"; then
              exit 0
            fi
            echo "emulator install attempt $i failed:"; tail -5 <<< "$out"
            sleep 15
          done
          exit 1

      - name: Play on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python .github/e2e/play.py app/build/outputs/apk/e2e/app-e2e.apk e2e-out --${{ needs.plan.outputs.suite }}

      - name: Publish screenshots
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/e2e/publish_shots.py e2e-out api-${{ matrix.api-level }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-api-${{ matrix.api-level }}
          path: e2e-out
