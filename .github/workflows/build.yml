name: Build APK

# Work happens in pull requests against main: they are checked on the merge result.
# Branches without a pull request are not built (a manual run is still possible).
on:
  push:
    branches: [main]
    tags: ["v*"]
    # Path filters are not applied to tag pushes, so releases are always built.
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      release:
        description: "Create tag v<versionName> on this commit and publish a release (after the full emulator suite)"
        type: boolean
        default: false
      untested:
        description: "With release: publish right away as an untested alpha (tag v<versionName>-alpha), without the emulator suite"
        type: boolean
        default: false

# A new push to a pull request cancels its outdated run. Runs on main, tags and
# manual runs (releases) get a group of their own and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Read version
        id: version
        run: echo "name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.name }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${{ steps.version.outputs.name }}"
            exit 1
          fi

      - name: Build release APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk spheres-${{ steps.version.outputs.name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: spheres-apk
          path: spheres-*.apk

  # A tested release needs the full emulator suite (API 26 and 35) on this commit.
  e2e:
    if: inputs.release && !inputs.untested
    uses: ./.github/workflows/emulator.yml
    with:
      suite: full

  publish:
    needs: [build, e2e]
    # Tag pushes publish as before; a manual release after the full suite, or right
    # away when asked for an untested alpha.
    if: >-
      always() && needs.build.result == 'success' && (
        startsWith(github.ref, 'refs/tags/v') ||
        (inputs.release && !inputs.untested && needs.e2e.result == 'success') ||
        (inputs.release && inputs.untested))
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
      ALPHA: ${{ inputs.release && inputs.untested && '-alpha' || '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spheres-apk

      - name: Name the APK
        if: env.ALPHA != ''
        run: mv "spheres-$VERSION.apk" "spheres-$VERSION$ALPHA.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # On a manual run the tag is created on the commit that was built.
          tag_name: v${{ env.VERSION }}${{ env.ALPHA }}
          target_commitish: ${{ github.sha }}
          name: spheres ${{ env.VERSION }}${{ env.ALPHA && ' (ungetestete Alpha)' || '' }}
          # Versions like 1.0.0-beta.1 and untested alphas are published as pre-releases.
          prerelease: ${{ contains(env.VERSION, '-') || env.ALPHA != '' }}
          files: spheres-*.apk
          body: |
            ${{ env.ALPHA && '**Ungetestete Alpha:** ohne die Emulator-Tests veröffentlicht, zum schnellen Ausprobieren. Die getestete Version folgt unter demselben Namen ohne „-alpha“.' || '' }}

            **Installieren:** Auf dem Handy `spheres-${{ env.VERSION }}${{ env.ALPHA }}.apk` unten unter *Assets* antippen,
            herunterladen, öffnen und „Apps aus dieser Quelle zulassen“ bestätigen. Benötigt Android 8.0 oder neuer.
            Neuere Versionen lassen sich einfach darüber installieren; Rekorde bleiben erhalten.
