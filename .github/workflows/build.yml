name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # Path filters are not applied to tag pushes, so releases are always built.
    paths-ignore: ["**.md"]
  # No pull_request trigger: every PR branch is already built on push.
  workflow_dispatch:
    inputs:
      release:
        description: "Create tag v<versionName> on this commit and publish a release"
        type: boolean
        default: false

# A new push to a branch cancels the outdated run on it. Runs on main, tags and
# manual runs (releases) get a group of their own and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Read version
        id: version
        run: echo "name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.name }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${{ steps.version.outputs.name }}"
            exit 1
          fi

      - name: Build release APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk spheres-${{ steps.version.outputs.name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: spheres-apk
          path: spheres-*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          # On a manual run the tag is created on the commit that was built.
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: spheres ${{ steps.version.outputs.name }}
          # Versions like 1.0.0-beta.1 are published as pre-releases.
          prerelease: ${{ contains(steps.version.outputs.name, '-') }}
          files: spheres-*.apk
          body: |
            **Installieren:** Auf dem Handy `spheres-${{ steps.version.outputs.name }}.apk` unten unter *Assets* antippen,
            herunterladen, öffnen und „Apps aus dieser Quelle zulassen“ bestätigen. Benötigt Android 8.0 oder neuer.
            Neuere Versionen lassen sich einfach darüber installieren; Rekorde bleiben erhalten.
